<main class="pagina-estrecha">
  <section class="panel">
    <h1>Iniciar sesión</h1>
    @if (recienRestablecida) {
      <p class="acceso__aviso" role="status">
        Contraseña cambiada. Entra con la nueva.
      </p>
    }
    <form (ngSubmit)="entrar()">
      <label>
        Correo electrónico
        <input
          type="email"
          name="email"
          autocomplete="email"
          required
          [(ngModel)]="email"
        />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
        />
      </label>
      <button
        type="submit"
        class="boton-primario"
        [disabled]="cargando() || !email().trim() || !password()"
      >
        {{ cargando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
    @if (error()) {
      <p class="acceso__error" role="alert">{{ error() }}</p>
    }
    <p class="acceso__alternativa">
      <a routerLink="/recuperar">¿Has olvidado tu contraseña?</a>
    </p>
    <p class="acceso__alternativa">
      ¿Aún no tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>
  </section>
</main>
