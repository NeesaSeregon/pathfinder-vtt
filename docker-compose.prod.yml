# Despliegue con COOLIFY. El docker-compose.yml de al lado es para
# DESARROLLO (solo levanta PostgreSQL y la app va con `nx serve`); este monta
# la aplicación entera ya compilada.
#
# Coolify se encarga de:
#   · el proxy inverso y el HTTPS (su Traefik pide el certificado solo),
#     así que aquí NO hay ningún servicio de proxy ni puertos 80/443.
#   · las variables de entorno y los secretos (se rellenan en su panel; los
#     ${...:?...} de abajo aparecen como campos a completar).
#   · el dominio: se asigna en el panel al servicio `api`, puerto 3000.
#
# Para probarlo en local sin Coolify:
#   DB_PASSWORD=... JWT_SECRET=... APP_URL=http://localhost:3000 \
#     docker compose -f docker-compose.prod.yml up --build
#   (APP_URL es obligatoria: sin ella el compose se niega a arrancar. Sin
#   las MAIL_* sí arranca, pero los correos van al log en vez de enviarse.)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Techo de memoria, no reserva: marca cuánto PUEDE llegar a usar, no
    # cuánto se le guarda. Sin topes, los ocho contenedores compiten por los
    # 3,8 GiB enteros y, cuando falta memoria, el kernel elige víctima por
    # tamaño en toda la máquina. Con tope, el que se desmadra se lleva solo a
    # sí mismo. Medido en reposo: 37 MiB, así que estos 768m son veinte veces
    # de margen y solo saltarían ante una consulta desbocada de verdad.
    #
    # OJO: es `mem_limit` y no `deploy.resources.limits`. Lo segundo solo lo
    # aplica Docker Swarm; `docker compose up` lo ignora en silencio.
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${DB_USER:-pathfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pathfinder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SIN 'ports': la base de datos no se asoma a internet, solo la ve la
    # red interna.
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pathfinder} -d ${DB_NAME:-pathfinder}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Migraciones: contenedor de UN SOLO USO. Corre, aplica lo pendiente y
  # termina. La API espera a que acabe bien (depends_on de abajo), así que en
  # cada despliegue el esquema queda al día ANTES de arrancar. Si una
  # migración falla, este contenedor sale con error, la API no arranca y
  # Coolify marca el despliegue como fallido — en vez de arrancar sobre un
  # esquema roto. Usa la fase `build` porque las migraciones necesitan el
  # TypeScript y ts-node, que no están en la imagen final.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    # Más holgado que los demás A PROPÓSITO: aquí corre ts-node con todo el
    # TypeScript del proyecto en memoria. Quedarse corto no protegería nada y
    # sí rompería el despliegue en cada intento, que es peor que el riesgo
    # que el tope evita.
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pathfinder}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pathfinder}
    command: npm run migration:run

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Medido en reposo: 60 MiB. 512m es ocho veces eso, así que no estorba en
    # uso normal; lo que hace es convertir una fuga de memoria en "se reinicia
    # este contenedor" en lugar de "el kernel mata lo que más ocupa", que
    # perfectamente podría ser PostgreSQL, que no tendría culpa de nada.
    #
    # Esto NO protege del pico de la compilación: los topes del compose se
    # aplican a los servicios en marcha, no a `docker build`. De eso protege
    # el swapfile del servidor (y, de verdad, compilar fuera de la máquina).
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      # No arranca hasta que las migraciones han terminado bien
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Techo del montón de V8, deliberadamente POR DEBAJO del mem_limit de
      # arriba. Sin esto, Node puede intentar crecer más allá del tope del
      # contenedor y el kernel lo mata en seco, sin dejar nada en el log: un
      # reinicio misterioso. Con esto, Node lanza antes un "JavaScript heap
      # out of memory" que sí se lee. Importa especialmente aquí porque no
      # hay métricas de ningún tipo: un reinicio silencioso no habría manera
      # de diagnosticarlo.
      NODE_OPTIONS: --max-old-space-size=384
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pathfinder}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pathfinder}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET}
      UPLOADS_DIR: /datos/uploads
      LOGIN_MAX_FALLOS: ${LOGIN_MAX_FALLOS:-5}
      LOGIN_BLOQUEO_SEGUNDOS: ${LOGIN_BLOQUEO_SEGUNDOS:-900}
      # De aquí sale el enlace de los correos de recuperación. OBLIGATORIA a
      # propósito: si faltara, los enlaces apuntarían a localhost y el correo
      # llegaría perfectamente… a ninguna parte. Mejor que el despliegue se
      # pare y lo veas, porque ese fallo no da la cara por ningún otro sitio.
      APP_URL: ${APP_URL:?define APP_URL, p. ej. https://rolnees.com sin barra final}
      # SMTP del proveedor (Resend). Si MAIL_HOST se queda vacío, la API NO
      # envía correos: los escribe en el log y deja un ERROR al arrancar.
      # Nadie podría recuperar su contraseña, así que rellénalas.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Freno de "he olvidado mi contraseña" (cuenta TODAS las peticiones)
      RECUPERACION_MAX_POR_EMAIL: ${RECUPERACION_MAX_POR_EMAIL:-3}
      RECUPERACION_MAX_POR_IP: ${RECUPERACION_MAX_POR_IP:-10}
      RECUPERACION_VENTANA_SEGUNDOS: ${RECUPERACION_VENTANA_SEGUNDOS:-3600}
      # CORREO_BUZON_DIR NO se pasa aquí ADREDE: escribe los tokens de
      # recuperación en claro en disco. Es solo para pruebas.
    # El puerto por el que el Traefik de Coolify entra a hablar con la API.
    # No es un 'ports' (no se publica a internet): Coolify conecta su proxy a
    # este contenedor por su red interna. El dominio se asigna en el panel.
    expose:
      - '3000'
    # Sonda de vida. Sin ella, Docker da el contenedor por bueno en cuanto el
    # proceso EXISTE, y el Traefik de Coolify puede mandarle visitas antes de
    # que Nest haya terminado de arrancar y abierto el pool contra Postgres.
    # Eso pasa justo después de desplegar, que es el peor momento posible.
    #
    # Usa `node` porque está garantizado en la imagen (alpine no trae curl) y
    # acepta cualquier respuesta por debajo de 500: el 401 de /api/demo vale
    # perfectamente, porque lo que se comprueba es "¿hay alguien escuchando y
    # enrutando?", no "¿tengo permiso?".
    #
    # Es una sonda de VIDA, no de PREPARACIÓN: no llega a tocar la base de
    # datos. El día que exista /api/health, apuntarla ahí añade esa parte.
    #
    # Y una limitación que conviene tener presente: Docker a secas NO
    # reinicia un contenedor por estar unhealthy (eso es cosa de Swarm). Esto
    # da la señal a Coolify y la deja visible en `docker ps`; no se cura solo.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/demo', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      # Margen de arranque: durante estos 20s los fallos no cuentan como tal.
      start_period: 20s
    volumes:
      # Los mapas subidos viven aquí. Si esto no fuera un volumen, se
      # perderían al recrear el contenedor.
      - uploads:/datos/uploads
    # Para depurar en local sin Coolify, descomenta y verás la API en
    # http://localhost:3000/api :
    # ports:
    #   - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  uploads:
